<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- RAG 问答助手：深蓝圆角底（取自前端主色 #1b4e91）+ 资料卡片 + 放大镜（检索） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6ac4"/>
      <stop offset="1" stop-color="#1b4e91"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#bg)"/>
  <rect x="48" y="44" width="96" height="128" rx="12" fill="#ffffff"/>
  <rect x="64" y="72" width="64" height="10" rx="5" fill="#d6e4fb"/>
  <rect x="64" y="96" width="64" height="10" rx="5" fill="#d6e4fb"/>
  <rect x="64" y="120" width="40" height="10" rx="5" fill="#d6e4fb"/>
  <g fill="none" stroke-linecap="round">
    <!-- 先用底色描一遍，作为白色描边与白色卡片之间的分隔，避免小尺寸糊成一团 -->
    <line x1="192" y1="190" x2="214" y2="212" stroke="#1b4e91" stroke-width="34"/>
    <line x1="192" y1="190" x2="214" y2="212" stroke="#ffffff" stroke-width="20"/>
    <circle cx="166" cy="164" r="38" stroke="#1b4e91" stroke-width="30"/>
    <circle cx="166" cy="164" r="38" stroke="#ffffff" stroke-width="18"/>
  </g>
</svg>
